design_version: 6

paths:
  repo: /mnt/isilon/oldridge_lab/leej/prenorm
  internal_store: ${paths.repo}/data/prenorm_store_10slide_v3
  internal_index: ${paths.repo}/data/index/index_10slide_v3.parquet
  s60_store: ${paths.repo}/data/external_s60_10slide_store_v1
  s60_index: ${paths.repo}/data/index/external_s60_10slide_index_v1.parquet
  s60_split_index: ${paths.repo}/data/index/external_s60_10slide_exp06_split.parquet
  output_dir: ${paths.repo}/outputs/${run.name}
  ckpt_dir: ${paths.output_dir}/ckpt
  stage0_dir: ${paths.repo}/outputs/exp06_stage0
  wandb_dir: ${paths.output_dir}/wandb

reference_scanner: at2
target_scanners: [gt450, versa, s60]

split:
  slides:
    train: ["12.5_4", "12.5_17", "2-8_1", "2-8_14", "8-12_5", "8-12_9"]
    val: ["12.5_27", "2-8_3"]
    test: ["8-12_14", "2-8_2"]

run:
  name: exp06a_lf16_10slide

pyramid:
  levels: 4

context:
  k: 8
  min_distance: 1024
  spatial_bins: 4

model:
  width: 32
  residual_scale: 0.12

loss:
  pair_low: 5.0
  ssim_low: 1.0
  residual: 0.05
  smooth: 0.05
  # Pipeline-level second application also harmonizes the slide context set.
  idempotence: 0.5

loader:
  queries_per_slide: 4
  batches_per_epoch: 300
  val_batches: 60
  test_batches: 300
  num_workers: 8
  handle_cache: 4
  aug: [flip, rot90]

optim:
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  precision: bf16-mixed
  grad_clip: 1.0

trainer:
  max_epochs: 30
  accelerator: gpu
  devices: 1
  accumulate_grad_batches: 2
  log_every_n_steps: 25
  milestone_epochs: [10, 30]
  fast_dev_run: false

wandb:
  project: prenorm-exp06
  name: ${run.name}
  mode: offline

runtime:
  seed: 1234
