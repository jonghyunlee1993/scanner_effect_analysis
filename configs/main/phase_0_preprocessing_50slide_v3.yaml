# Full-cohort Phase 0 v3 configuration (50 slides; 40/5/5 = 8:1:1 split).
_base_: ../_base/phase_0_preprocessing.yaml

paths:
  output_store: ${paths.repo}/data/prenorm_store_50slide_v3
  output_index: ${paths.repo}/data/index/index_50slide_v3.parquet
  qc_dir: ${paths.repo}/data/qc_50slide_v3
  stain_reference: ${paths.repo}/data/at2_stain_reference_50slide_v3.npz

align:
  max_pad: 0.01
  max_residual_shift: 8.0

budget:
  grid_fraction: 0.30
  tiles_per_slide: 1500
  high_ncc_quota: 0.0

split:
  policy: explicit
  slides:
    # Keep the 10-slide pilot's held-out slides in their original roles, then
    # extend the remaining full-cohort slides into train for an exact 8:1:1 split.
    train: ["12.5_4", "12.5_5", "12.5_6", "12.5_7", "12.5_8", "12.5_17", "12.5_18", "12.5_24", "12.5_30", "12.5_32", "2-8_1", "2-8_14", "2-8_17", "2-8_26", "2-8_29", "2-8_30", "2-8_32", "2-8_34", "2-8_37", "8-12_5", "8-12_9", "8-12_11", "8-12_15", "8-12_16", "8-12_19", "8-12_23", "8-12_26", "8-12_27", "8-12_34", "8-12_36", "2-8_20", "2-8_23", "2-8_27", "8-12_33", "12.5_25", "2-8_28", "8-12_35", "8-12_38", "8-12_39", "12.5_29"]
    val: ["12.5_27", "2-8_3", "2-8_8", "2-8_19", "8-12_10"]
    test: ["8-12_14", "2-8_2", "12.5_21", "2-8_18", "8-12_32"]

runtime:
  num_workers: 4
